name: Update K-SOX2 signal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"  # 17:00 KST

permissions:
  contents: write

jobs:
  update-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calculate K-SOX2 signal
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python ksox2.py

      - name: Commit updated signal and cached history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ksox2_signal.json ksox2_history.csv ksox2_prices.csv
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "Update K-SOX2 signal"
            git push
          fi
